name: PHP Lint

on:
    pull_request:
        branches: [ main ]
        paths:
            - 'backend/**.php'

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository code
              uses: actions/checkout@v4

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Check PHP Version
              run: php -v

            - name: Lint PHP files
              run: find ./backend -name "*.php" -print0 | xargs -0 -n1 php -l
